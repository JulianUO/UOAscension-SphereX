name: Linux ARM64 (Raspberry Pi)

on:
  push:
    paths-ignore:
      - '.gitignore'
      - '.gitattributes'
      - '**.txt'
      - '**.md'
      - '**.rc'
  pull_request:
    branches:
      - 'master'
      - 'main'
      - 'dev'
    paths-ignore:
      - '*.txt'
      - '*.md'

jobs:
  linux-arm64:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install prerequisites
      run: |
        lsb_release -d

        # Ensure default repos only query amd64 and i386
        sudo rm -f /etc/apt/sources.list
        sudo rm -f /etc/apt/sources.list.d/*.list 2>/dev/null || true

        cat << 'EOF' | sudo tee /etc/apt/sources.list.d/ubuntu.sources
Types: deb
URIs: http://azure.archive.ubuntu.com/ubuntu/ http://security.ubuntu.com/ubuntu/
Suites: noble noble-updates noble-security noble-backports
Components: main universe restricted multiverse
Architectures: amd64 i386
Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
EOF

        cat << 'EOF' | sudo tee /etc/apt/sources.list.d/arm64.sources
Types: deb
URIs: http://ports.ubuntu.com/ubuntu-ports/
Suites: noble noble-updates noble-security noble-backports
Components: main universe restricted multiverse
Architectures: arm64
Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
EOF

        sudo dpkg --add-architecture arm64
        sudo apt-get -qq update > /dev/null
        sudo apt-get install -y --no-install-recommends \
          ninja-build gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
          ccache \
          libc6:arm64 libgcc-s1:arm64 zlib1g:arm64 libmariadb-dev:arm64

    - name: Set up ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ github.job }}

    - name: Configure ccache
      run: ccache --set-config sloppiness="include_file_mtime, include_file_ctime, time_macros, pch_defines"

    - name: Report building tools
      run: |
        echo "AArch64 GCC:" && aarch64-linux-gnu-gcc -v
        echo "CMake:" && cmake --version
        echo "Ninja:" && ninja --version

    - name: CMake
      run: |
        mkdir -p build
        cmake -G "Ninja" -DCMAKE_BUILD_TYPE="Nightly" \
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/Linux-GNU-AArch64.cmake \
          -DCROSSCOMPILING_ARCH=1 \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -S ./ -B ./build

    - name: Ninja
      run: ninja -C build -v

    - name: Create package
      run: |
        mkdir accounts logs save scripts
        tar -czf SphereSvrX-raspberry-aarch64-nightly.tar.gz accounts/ logs/ save/ scripts/ -C build/bin-aarch64/ SphereSvrX64_nightly -C ../../src sphere.ini sphereCrypt.ini

    - name: Upload artifact
      if: contains(fromJson('["master", "main", "dev"]'), github.ref_name) || github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: Build-raspberry-aarch64
        path: SphereSvrX-raspberry-aarch64-nightly.tar.gz
        overwrite: true

  upload_github_release:
    needs: linux-arm64
    if: contains(fromJson('["master", "main"]'), github.ref_name) && github.event_name == 'push'
    permissions:
      contents: write
      actions: read

    runs-on: ubuntu-latest
    steps:
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          name: Build-raspberry-aarch64

      - name: Create release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Nightly
          tag_name: Nightly
          prerelease: true
          files: SphereSvrX-raspberry-aarch64-nightly.tar.gz
