name: OSX x86_64

on:
  push:
    paths-ignore:
      - '.gitignore'
      - '.gitattributes'
      - '**.txt'
      - '**.md'
      - '**.rc'
  pull_request:
    branches:
      - 'master'
      - 'main'
      - 'dev'

jobs:
  osx-x86_64:
    runs-on: macos-13
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install prerequisites
        run: |
          brew update
          brew install ninja ccache mariadb-connector-c

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}

      - name: CMake
        run: |
          mkdir -p build
          cmake -G "Ninja" -DCMAKE_BUILD_TYPE="Nightly" \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/OSX-AppleClang-x86_64.cmake \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -S ./ -B ./build

      - name: Ninja
        run: ninja -C build -v

      - name: Create package
        run: |
          mkdir accounts logs save scripts
          tar -czf SphereSvrX-osx-x86_64-nightly.tar.gz accounts/ logs/ save/ scripts/ -C build/bin-x86_64/ SphereSvrX64_nightly -C ../../src sphere.ini sphereCrypt.ini

      - name: Upload artifact
        if: contains(fromJson('["master", "main", "dev"]'), github.ref_name) || github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Build-osx-x86_64
          path: SphereSvrX-osx-x86_64-nightly.tar.gz
          overwrite: true

  upload_github_release:
    needs: osx-x86_64
    if: contains(fromJson('["master", "main"]'), github.ref_name) && github.event_name == 'push'
    permissions:
      contents: write
      actions: read

    runs-on: ubuntu-latest
    steps:
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          name: Build-osx-x86_64

      - name: Create release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Nightly
          tag_name: Nightly
          prerelease: true
          files: SphereSvrX-osx-x86_64-nightly.tar.gz
