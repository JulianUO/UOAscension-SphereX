; UltimaLive graphic harvest — optional overrides for built-in stock trees.
; Built-in C++ registry already includes all stock UO trees from HarvestableTrees.cs:
;   0xCCA-0xCCC, 0xC9E, 0xCCD+leaves, 0xCD0-0xD03, yucca, fruit trees, etc.
; Uncomment sections below only to override fallen/stump/sapling graphics.

;[TREE_0x0CCD]
;MATURE=0xCCD,0,0
;MATURE=0xCCE,0,0
;MATURE=0xCCF,0,0
;FALLEN=0xCF5,-3,0
;FALLEN=0xCF6,-2,0
;FALLEN=0xCF7,-1,0
;STUMP=0xE57
;SAPLING=0xCEA,0,0
